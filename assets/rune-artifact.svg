<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">Rune evidence seal</title><desc id="desc">An illustrative artifact seal. Targets must execute validation before claiming support.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10151a"/><stop offset="1" stop-color="#1f1915"/></linearGradient><linearGradient id="copper"><stop stop-color="#b97549"/><stop offset="1" stop-color="#ffcd87"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b98551" stroke-opacity=".06"/></pattern></defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#eee9e1} .muted{fill:#afa69c;font-size:15px} .small{fill:#afa69c;font-size:12px;letter-spacing:2px} .edge{fill:none;stroke:#564335;stroke-width:1.5} .flow{fill:none;stroke:#ffbd70;stroke-width:2;stroke-dasharray:7 17;animation:travel 8s linear infinite} .pulse{animation:pulse 4s ease-in-out infinite} .draw{stroke-dasharray:720;stroke-dashoffset:0;animation:inscribe 7s ease-in-out infinite} .orbit{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
@keyframes travel{to{stroke-dashoffset:-240}} @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}} @keyframes inscribe{0%{stroke-dashoffset:720;opacity:.3}35%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.3}} @keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.draw,.orbit{animation:none!important}}
</style><rect width="1200" height="340" rx="18" fill="url(#bg)"/><rect width="1200" height="340" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="1199" height="339" rx="18" fill="none" stroke="#5d4936"/><text x="40" y="46" class="small">THE ARTIFACT SEAL / TARGET VALIDATION IS REQUIRED</text><g transform="translate(195 180)"><circle r="90" fill="none" stroke="#6b5039" stroke-dasharray="4 8"/><path d="M0-65 56-32 56 32 0 65-56 32-56-32Z" fill="#151b1d" stroke="#d39961" stroke-width="2"/><path d="M-25 0-5 20 30-22" fill="none" stroke="#ffca88" stroke-width="5" class="draw"/></g><text x="350" y="123" font-size="24">One identity. Traceable evidence.</text><text x="350" y="165" class="muted">Source + dependencies + plan + toolchain + tests + artifact digest</text><text x="350" y="205" class="muted">x86 native / ARM, WASM emulated build and run</text><text x="350" y="241" class="muted">RVF: artifact envelope. RVM: governed execution. RVForge: staging.</text><text x="350" y="290" class="small">A SIGNATURE PROVES INTEGRITY, NOT CORRECTNESS.</text></svg>