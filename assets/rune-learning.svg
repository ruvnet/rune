<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="475" viewBox="0 0 1200 475" role="img" aria-labelledby="title desc"><title id="title">Rune learning loop</title><desc id="desc">Recall, propose, apply, evaluate, retain and record. Any failure rejects a candidate and preserves its baseline.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10151a"/><stop offset="1" stop-color="#1f1915"/></linearGradient><linearGradient id="copper"><stop stop-color="#b97549"/><stop offset="1" stop-color="#ffcd87"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b98551" stroke-opacity=".06"/></pattern></defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#eee9e1} .muted{fill:#afa69c;font-size:15px} .small{fill:#afa69c;font-size:12px;letter-spacing:2px} .edge{fill:none;stroke:#564335;stroke-width:1.5} .flow{fill:none;stroke:#ffbd70;stroke-width:2;stroke-dasharray:7 17;animation:travel 8s linear infinite} .pulse{animation:pulse 4s ease-in-out infinite} .draw{stroke-dasharray:720;stroke-dashoffset:0;animation:inscribe 7s ease-in-out infinite} .orbit{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
@keyframes travel{to{stroke-dashoffset:-240}} @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}} @keyframes inscribe{0%{stroke-dashoffset:720;opacity:.3}35%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.3}} @keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.draw,.orbit{animation:none!important}}
</style><rect width="1200" height="475" rx="18" fill="url(#bg)"/><rect width="1200" height="475" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="1199" height="474" rx="18" fill="none" stroke="#5d4936"/><text x="40" y="46" class="small">THE LEARNING LOOP / PROPOSED ADAPTERS</text><path d="M220 145H980V340H220Z" class="edge"/><path d="M220 145H980V340H220Z" class="flow"/><rect x="108" y="99" width="224" height="92" rx="12" fill="#141a1e" stroke="#72553c"/><text x="220" y="142" text-anchor="middle" font-size="17" letter-spacing="3">RECALL</text><text x="220" y="169" text-anchor="middle" class="muted">RuVector</text><rect x="488" y="99" width="224" height="92" rx="12" fill="#141a1e" stroke="#72553c"/><text x="600" y="142" text-anchor="middle" font-size="17" letter-spacing="3">PROPOSE</text><text x="600" y="169" text-anchor="middle" class="muted">OpenRouter</text><rect x="868" y="99" width="224" height="92" rx="12" fill="#141a1e" stroke="#72553c"/><text x="980" y="142" text-anchor="middle" font-size="17" letter-spacing="3">APPLY</text><text x="980" y="169" text-anchor="middle" class="muted">Agent Booster</text><rect x="868" y="294" width="224" height="92" rx="12" fill="#141a1e" stroke="#72553c"/><text x="980" y="337" text-anchor="middle" font-size="17" letter-spacing="3">EVALUATE</text><text x="980" y="364" text-anchor="middle" class="muted">MetaHarness</text><rect x="488" y="294" width="224" height="92" rx="12" fill="#141a1e" stroke="#72553c"/><text x="600" y="337" text-anchor="middle" font-size="17" letter-spacing="3">RETAIN</text><text x="600" y="364" text-anchor="middle" class="muted">Autogenous gate</text><rect x="108" y="294" width="224" height="92" rx="12" fill="#141a1e" stroke="#72553c"/><text x="220" y="337" text-anchor="middle" font-size="17" letter-spacing="3">RECORD</text><text x="220" y="364" text-anchor="middle" class="muted">Evidence memory</text><text x="600" y="247" text-anchor="middle" fill="#ffbd70" font-size="16">REJECT / PRESERVE BASELINE</text><text x="600" y="438" text-anchor="middle" class="muted">Similarity suggests. Measurements decide. Evaluator policy stays outside the optimizer.</text></svg>