<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc"><title id="title">Rune build graph</title><desc id="desc">Intent, plan, build and verify. Moving strokes show conceptual data flow, not live telemetry.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10151a"/><stop offset="1" stop-color="#1f1915"/></linearGradient><linearGradient id="copper"><stop stop-color="#b97549"/><stop offset="1" stop-color="#ffcd87"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b98551" stroke-opacity=".06"/></pattern></defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#eee9e1} .muted{fill:#afa69c;font-size:15px} .small{fill:#afa69c;font-size:12px;letter-spacing:2px} .edge{fill:none;stroke:#564335;stroke-width:1.5} .flow{fill:none;stroke:#ffbd70;stroke-width:2;stroke-dasharray:7 17;animation:travel 8s linear infinite} .pulse{animation:pulse 4s ease-in-out infinite} .draw{stroke-dasharray:720;stroke-dashoffset:0;animation:inscribe 7s ease-in-out infinite} .orbit{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
@keyframes travel{to{stroke-dashoffset:-240}} @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}} @keyframes inscribe{0%{stroke-dashoffset:720;opacity:.3}35%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.3}} @keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.draw,.orbit{animation:none!important}}
</style><rect width="1200" height="370" rx="18" fill="url(#bg)"/><rect width="1200" height="370" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="1199" height="369" rx="18" fill="none" stroke="#5d4936"/><text x="40" y="46" class="small">THE BUILD GRAPH / PROPOSED EXECUTION CONTRACT</text><path d="M188 170H402" class="edge"/><path d="M188 170H402" class="flow"/><g transform="translate(145 170)"><path d="M0-46 40-23 40 23 0 46-40 23-40-23Z" fill="#151a1d" stroke="#b78255"/><path d="M-12 15V-15L12 0-12 8" fill="none" stroke="#ffc384" stroke-width="3"/><text y="85" text-anchor="middle" font-size="18" letter-spacing="3">INTENT</text><text y="112" text-anchor="middle" class="muted">contracts + policy</text></g><path d="M488 170H702" class="edge"/><path d="M488 170H702" class="flow"/><g transform="translate(445 170)"><path d="M0-46 40-23 40 23 0 46-40 23-40-23Z" fill="#151a1d" stroke="#b78255"/><path d="M-13-14H13L0 0 13 14H-13" fill="none" stroke="#ffc384" stroke-width="3"/><text y="85" text-anchor="middle" font-size="18" letter-spacing="3">PLAN</text><text y="112" text-anchor="middle" class="muted">locked inputs</text></g><path d="M788 170H1002" class="edge"/><path d="M788 170H1002" class="flow"/><g transform="translate(745 170)"><path d="M0-46 40-23 40 23 0 46-40 23-40-23Z" fill="#151a1d" stroke="#b78255"/><path d="M-14 14 0-14 14 14M-8 4H8" fill="none" stroke="#ffc384" stroke-width="3"/><text y="85" text-anchor="middle" font-size="18" letter-spacing="3">BUILD</text><text y="112" text-anchor="middle" class="muted">pinned toolchain</text></g><g transform="translate(1045 170)"><path d="M0-46 40-23 40 23 0 46-40 23-40-23Z" fill="#151a1d" stroke="#b78255"/><path d="M-15 0-4 12 16-12" fill="none" stroke="#ffc384" stroke-width="3"/><text y="85" text-anchor="middle" font-size="18" letter-spacing="3">VERIFY</text><text y="112" text-anchor="middle" class="muted">evidence + decision</text></g><text x="600" y="332" text-anchor="middle" class="muted">Approved builds replay without agents. Discovery cannot rewrite the acceptance contract.</text></svg>