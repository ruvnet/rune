<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Rune: the learning toolchain for Rust</title><desc id="desc">Animated geometric R surrounded by a build constellation. Deterministic builds and validated discovery.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10151a"/><stop offset="1" stop-color="#1f1915"/></linearGradient><linearGradient id="copper"><stop stop-color="#b97549"/><stop offset="1" stop-color="#ffcd87"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#b98551" stroke-opacity=".06"/></pattern></defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#eee9e1} .muted{fill:#afa69c;font-size:15px} .small{fill:#afa69c;font-size:12px;letter-spacing:2px} .edge{fill:none;stroke:#564335;stroke-width:1.5} .flow{fill:none;stroke:#ffbd70;stroke-width:2;stroke-dasharray:7 17;animation:travel 8s linear infinite} .pulse{animation:pulse 4s ease-in-out infinite} .draw{stroke-dasharray:720;stroke-dashoffset:0;animation:inscribe 7s ease-in-out infinite} .orbit{transform-box:fill-box;transform-origin:center;animation:spin 60s linear infinite}
@keyframes travel{to{stroke-dashoffset:-240}} @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}} @keyframes inscribe{0%{stroke-dashoffset:720;opacity:.3}35%,85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.3}} @keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.flow,.pulse,.draw,.orbit{animation:none!important}}
</style><rect width="1200" height="430" rx="18" fill="url(#bg)"/><rect width="1200" height="430" rx="18" fill="url(#grid)"/><rect x=".5" y=".5" width="1199" height="429" rx="18" fill="none" stroke="#5d4936"/>
<g transform="translate(235 210)"><g class="orbit" fill="none" stroke="#735035"><circle r="143" stroke-dasharray="2 14"/><path d="M0-167 145-84 145 84 0 167-145 84-145-84Z" stroke-opacity=".6"/></g><circle r="110" fill="#12171a" stroke="#87613f"/><path d="M-40 65V-65L42-20-40 25M-40-5 48 65" fill="none" stroke="url(#copper)" stroke-width="9" stroke-linejoin="bevel" class="draw"/><g fill="#ffbd70"><circle cx="0" cy="-167" r="4" class="pulse"/><circle cx="145" cy="84" r="4" class="pulse"/><circle cx="-145" cy="84" r="4" class="pulse"/></g></g>
<text x="450" y="108" class="small">RUVNET / LEARNING TOOLCHAIN</text><text x="445" y="200" font-size="88" font-weight="700" letter-spacing="15">RUNE</text><text x="450" y="248" font-size="25">The learning toolchain for Rust.</text><text x="450" y="286" class="muted">Declare intent. Explore alternatives. Keep what passes.</text><path d="M450 317H1085" class="edge"/><text x="450" y="352" class="small">DETERMINISTIC BUILDS</text><text x="710" y="352" class="small">BOUNDED DISCOVERY</text><text x="450" y="379" class="small">INDEPENDENT VALIDATION</text><text x="710" y="379" class="small">PORTABLE EVIDENCE</text></svg>