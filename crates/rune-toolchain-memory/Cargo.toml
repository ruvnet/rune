[package]
name = "rune-toolchain-memory"
description = "Evidence and transfer memory for the Rune learning toolchain: recipes, approval keys, ranking, frozen snapshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["memory", "retrieval", "toolchain", "evidence"]
categories = ["development-tools::build-utils"]

[lib]
name = "rune_memory"

[features]
default = []
# Optional HNSW ranking through ruvector-core. Off by default; ranking only.
ruvector = ["dep:ruvector-core"]

[dependencies]
rune-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ruvector-core = { version = "2.4.0", default-features = false, features = ["hnsw"], optional = true }

[dev-dependencies]
tempfile = "3"
