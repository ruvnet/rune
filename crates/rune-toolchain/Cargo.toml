[package]
name = "rune-toolchain"
description = "Rune: the learning toolchain for Rust. Frozen build plans, offline replay, independent verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["cargo", "build", "toolchain", "reproducible", "cli"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[[bin]]
name = "rune"
path = "src/main.rs"

[dependencies]
rune-core.workspace = true
rune-cargo.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
rune-core.workspace = true
