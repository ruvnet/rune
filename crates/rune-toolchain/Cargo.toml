[package]
name = "rune-toolchain"
description = "Rune: the learning toolchain for Rust. Frozen build plans, offline replay, independent verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["cargo", "build", "toolchain", "reproducible", "cli"]
categories = ["development-tools::build-utils", "command-line-utilities"]

[[bin]]
name = "rune"
path = "src/main.rs"

[dependencies]
rune-core.workspace = true
rune-cargo.workspace = true
rune-edit = { package = "rune-toolchain-edit", version = "0.3.0", path = "../rune-toolchain-edit" }
rune-eval = { package = "rune-toolchain-eval", version = "0.3.0", path = "../rune-toolchain-eval" }
rune-memory = { package = "rune-toolchain-memory", version = "0.3.0", path = "../rune-toolchain-memory" }
rune-target = { package = "rune-toolchain-target", version = "0.3.0", path = "../rune-toolchain-target" }
rune-gc = { package = "rune-toolchain-gc", version = "0.3.0", path = "../rune-toolchain-gc" }
serde.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
rune-core.workspace = true
