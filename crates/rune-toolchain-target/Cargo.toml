[package]
name = "rune-toolchain-target"
description = "Hardware contracts, cross builds, executors and the artifact evidence envelope for the Rune learning toolchain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["cross-compilation", "target", "artifact", "attestation"]
categories = ["development-tools::build-utils"]

[lib]
name = "rune_target"

[dependencies]
rune-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
