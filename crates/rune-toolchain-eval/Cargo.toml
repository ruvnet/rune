[package]
name = "rune-toolchain-eval"
description = "Rune's own independent evaluator (ADR 005) and copy-on-write candidate workspace (ADR 007)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["benchmark", "evaluation", "isolation", "rust"]
categories = ["development-tools::testing"]

[lib]
name = "rune_eval"

[[bin]]
name = "rune-eval"
path = "src/bin/rune-eval.rs"

[dependencies]
rune-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
