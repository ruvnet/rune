[workspace]
resolver = "2"
members = ["crates/rune-toolchain-core", "crates/rune-toolchain-cargo", "crates/rune-toolchain"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ruvnet/rune"
authors = ["rUv <ruv@ruv.net>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rune-core = { package = "rune-toolchain-core", version = "0.1.0", path = "crates/rune-toolchain-core" }
rune-cargo = { package = "rune-toolchain-cargo", version = "0.1.0", path = "crates/rune-toolchain-cargo" }

[profile.release]
lto = true
codegen-units = 1
strip = true
